<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Post — 0xbanuchichak</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/green-screen.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    .reading-time{font-family:var(--font-mono);font-size:.7rem;color:var(--text-muted);padding:.2rem .6rem;border:1px solid var(--border);border-radius:2px}
    .share-section{border-top:1px solid var(--border);margin-top:4rem;padding-top:2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .share-label{font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted)}
    .share-btn{font-family:var(--font-mono);font-size:.72rem;padding:.4rem 1rem;background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;cursor:pointer;text-decoration:none;transition:all .2s}
    .share-btn:hover{border-color:var(--green);color:var(--green)}
    .post-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;border-top:1px solid var(--border);padding-top:2rem}
    .post-nav-link{font-family:var(--font-mono);font-size:.75rem;color:var(--text-dim);text-decoration:none;flex:1;padding:1rem;border:1px solid var(--border);border-radius:4px;transition:all .2s}
    .post-nav-link:hover{border-color:var(--green);color:var(--green);background:var(--green-glow)}
    .post-nav-link.next{text-align:right}
    .post-nav-dir{display:block;font-size:.65rem;color:var(--text-muted);margin-bottom:.3rem}
    .toc{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:4px;padding:1.5rem;margin-bottom:2.5rem}
    .toc-title{font-family:var(--font-mono);font-size:.75rem;color:var(--green-dim);letter-spacing:2px;margin-bottom:1rem}
    .toc ul{list-style:none;margin:0;padding:0}
    .toc li{margin-bottom:.4rem}
    .toc a{font-family:var(--font-mono);font-size:.8rem;color:var(--text-dim);text-decoration:none;transition:color .2s}
    .toc a:hover{color:var(--green)}
    .toc a::before{content:'→ ';color:var(--text-muted)}
    .hljs{background:rgba(0,0,0,.6)!important;font-size:.85rem}
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="matrix-bg" id="matrixBg"></div>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <span class="logo-prefix">~/</span>
        <a href="index.html" class="logo">0xbanuchichak</a>
        <span class="cursor-blink">_</span>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">home</a>
        <a href="posts.html" class="nav-link">posts</a>
        <a href="about.html" class="nav-link">about</a>
        <a href="admin/index.html" class="nav-link admin-link">&#9881; admin</a>
      </nav>
      <div class="header-status"><span class="status-dot"></span><span class="status-text">SYSTEM ONLINE</span></div>
    </div>
  </header>
  <div class="post-page-header">
    <a href="javascript:history.back()" class="back-link">← go back</a>
    <div id="postMetaTop" class="post-meta"></div>
    <h1 class="post-page-title" id="postTitle">Loading...</h1>
    <div class="post-page-meta" id="postPageMeta"></div>
  </div>
  <div class="post-page-img" id="postCoverWrap" style="display:none"><img id="postCoverImg" src="" alt="Cover"/></div>
  <div class="post-page-body">
    <div class="toc" id="tocBox" style="display:none"><div class="toc-title">// TABLE OF CONTENTS</div><ul id="tocList"></ul></div>
    <div id="postBody"><div style="text-align:center;padding:4rem;font-family:var(--font-mono);color:var(--text-muted)">Loading post...</div></div>
    <div class="share-section">
      <span class="share-label">// SHARE:</span>
      <a id="shareTwitter" href="#" target="_blank" class="share-btn">Twitter/X</a>
      <a id="shareLinkedIn" href="#" target="_blank" class="share-btn">LinkedIn</a>
      <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href).then(()=>alert('Link copied!'))">Copy Link</button>
    </div>
    <div class="post-nav" id="postNav"></div>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-left"><span class="logo">0xbanuchichak</span><p>Exploring the dark side of security, one writeup at a time.</p></div>
      <div class="footer-right"><div class="footer-links"><a href="https://github.com/" target="_blank">GitHub</a><a href="https://twitter.com/" target="_blank">Twitter</a></div><p class="footer-copy">© 2025 0xbanuchichak.</p></div>
    </div>
  </footer>
  <script src="js/posts-data.js"></script>
  <script src="js/matrix.js"></script>
  <script>
    function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function calcRT(t){return Math.max(1,Math.ceil(t.trim().split(/\s+/).length/200))}
    function buildTOC(bodyEl){
      const hs=bodyEl.querySelectorAll('h2,h3');if(hs.length<2)return;
      const box=document.getElementById('tocBox'),list=document.getElementById('tocList');
      box.style.display='';
      hs.forEach((h,i)=>{h.id='h'+i;const li=document.createElement('li');if(h.tagName==='H3')li.style.paddingLeft='1rem';li.innerHTML=`<a href="#h${i}">${h.textContent}</a>`;list.appendChild(li);});
    }
    document.addEventListener('DOMContentLoaded',()=>{
      const id=new URLSearchParams(window.location.search).get('id');
      if(!id){document.getElementById('postTitle').textContent='Post not found';return;}
      const post=PostsDB.getById(id);
      if(!post){document.getElementById('postTitle').textContent='Post not found.';document.getElementById('postBody').innerHTML='<p style="font-family:var(--font-mono);color:var(--text-muted)">This post does not exist or was deleted.</p>';return;}
      document.title=post.title+' — 0xbanuchichak';
      document.getElementById('postTitle').textContent=post.title;
      const date=new Date(post.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
      document.getElementById('postMetaTop').innerHTML=`<span class="post-tag">${escHtml(post.category||'general')}</span>`;
      document.getElementById('postPageMeta').innerHTML=`<span style="font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted)">📅 ${date}</span><span class="reading-time">⏱ ${calcRT(post.content||'')} min read</span>`;
      if(post.coverImage){document.getElementById('postCoverWrap').style.display='';document.getElementById('postCoverImg').src=post.coverImage;document.getElementById('postCoverImg').alt=post.title;}
      const bodyEl=document.getElementById('postBody');
      bodyEl.innerHTML=post.content||'';
      bodyEl.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b));
      buildTOC(bodyEl);
      const url=encodeURIComponent(window.location.href),title=encodeURIComponent(post.title);
      document.getElementById('shareTwitter').href='https://twitter.com/intent/tweet?url='+url+'&text='+title;
      document.getElementById('shareLinkedIn').href='https://www.linkedin.com/sharing/share-offsite/?url='+url;
      const all=PostsDB.getAll(),idx=all.findIndex(p=>p.id===id),nav=document.getElementById('postNav');
      let h='';
      if(idx<all.length-1){const p=all[idx+1];h+=`<a href="post.html?id=${p.id}" class="post-nav-link prev"><span class="post-nav-dir">← previous post</span>${escHtml(p.title)}</a>`;}else h+='<span></span>';
      if(idx>0){const p=all[idx-1];h+=`<a href="post.html?id=${p.id}" class="post-nav-link next"><span class="post-nav-dir">next post →</span>${escHtml(p.title)}</a>`;}
      nav.innerHTML=h;
    });
  </script>
</body>
</html>
